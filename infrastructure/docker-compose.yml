services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hedgefund
      POSTGRES_USER: hedgefund
      POSTGRES_PASSWORD: localdev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hedgefund"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
